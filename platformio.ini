; ESP32-C3-Mini 网络收音机
; 硬件: ESP32-C3 SuperMini + MAX98357A (I2S)
[env:esp32-c3-mini]
platform = espressif32@6.3.2
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = default

; 本机插上后是 COM5 (VID:PID=303A:1001 = Espressif USB Serial/JTAG)。
; 换电脑/换口后改这里, 或临时用 `pio run -t upload --upload-port COMx` 覆盖。
upload_port  = COM5
monitor_port = COM5

lib_deps =
    earlephilhower/ESP8266Audio @ ^1.9.7

; 见 exclude_midi.py: 库自带的 TinySoundFont 在 ESP32 上被整个 #if 掉,
; AudioGeneratorMIDI.cpp 必定编译失败, 而我们不用 MIDI。
extra_scripts =
    pre:exclude_midi.py

build_flags =
    ; ESP32-C3 SuperMini 走原生 USB Serial/JTAG 直连上位机(没有 CH340 这类桥片),
    ; Serial 就是 HWCDC, 不是 UART0。
    ; HWCDC.h 里 `Serial` 的声明被两层条件包着:
    ;   #if ARDUINO_USB_MODE
    ;     #if ARDUINO_USB_CDC_ON_BOOT
    ;       extern HWCDC Serial;
    ; 而 HardwareSerial.h 里恰好相反:
    ;   #if ARDUINO_USB_CDC_ON_BOOT -> 只声明 Serial0, 不声明 Serial
    ; 只设 ARDUINO_USB_CDC_ON_BOOT=1 而忘了 ARDUINO_USB_MODE(=1 表示走原生 USB
    ; Serial/JTAG 而不是 TinyUSB OTG), 两处都不会声明 Serial -> "Serial was not declared"。
    ; 这两个必须成对出现。
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    ; 关掉蓝牙，省 ~30KB RAM / 大量 Flash
    -D CONFIG_BT_ENABLED=0
    -D CONFIG_BT_BLE_ENABLED=0
    -D CONFIG_BT_CLASSIC_ENABLED=0

board_build.filesystem = littlefs
upload_speed = 921600
